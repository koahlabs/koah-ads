<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in to Sidequest</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
<tr><td align="center" style="padding:40px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#000000;">
<tr><td style="padding:0 0 32px 0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-0.02em;color:#000000;">sidequest</td></tr>
<tr><td style="padding:0 0 24px 0;font-size:16px;line-height:26px;color:#000000;">Use this button to sign in. The link works once and expires in 1 hour.</td></tr>
<tr><td style="padding:0 0 32px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td bgcolor="#000000" style="background:#000000;border-radius:8px;"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 24px;font-size:16px;line-height:20px;font-weight:500;color:#ffffff;text-decoration:none;border-radius:8px;">Sign in to Sidequest</a></td>
</tr></table>
</td></tr>
<tr><td style="padding:0 0 8px 0;font-size:14px;line-height:22px;color:#666666;">Button not working? Copy this link into your browser:</td></tr>
<tr><td style="padding:0 0 32px 0;font-size:14px;line-height:22px;color:#666666;word-break:break-all;"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="color:#666666;text-decoration:underline;">{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email</a></td></tr>
<tr><td style="font-size:14px;line-height:22px;color:#666666;">Didn’t ask to sign in? You can ignore this email.</td></tr>
</table>
</td></tr>
</table>

</html>
